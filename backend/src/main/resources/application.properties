spring.application.name=threatlens-backend

# MongoDB Configuration (Spring Boot 4 uses spring.mongodb.*)
spring.mongodb.uri=${MONGO_URI:mongodb://threatlens_admin:VanparX77@localhost:27018/threatlens?authSource=admin}
spring.mongodb.host=${MONGO_HOST:localhost}
spring.mongodb.port=${MONGO_PORT:27018}
spring.mongodb.database=${MONGO_DATABASE:threatlens}
spring.mongodb.username=${MONGO_USERNAME:threatlens_admin}
spring.mongodb.password=${MONGO_PASSWORD:VanparX77}
spring.mongodb.authentication-database=admin
spring.data.mongodb.uri=${MONGO_URI:mongodb://threatlens_admin:VanparX77@localhost:27018/threatlens?authSource=admin}

# Server
server.port=${SERVER_PORT:8080}

# JWT Configuration
jwt.secret=${JWT_SECRET:ThreatLens-Super-Secret-Key-For-JWT-Authentication-2024-Capstone}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.mail.enabled=false

# Admin provisioning (used only at startup if no admin exists)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:ChangeMe!Admin123}
app.admin.email=${ADMIN_EMAIL:admin@threatlens.local}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Logging (don't log sensitive data)
logging.level.com.threatlens=INFO
logging.level.org.springframework.security=WARN

# Outbound Email (SMTP) Configuration
# Configure these to deliver real alert emails directly to your Gmail / Outlook inbox:
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.connectiontimeout=5000
