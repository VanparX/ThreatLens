services:
  mongodb:
    image: mongo:7
    container_name: threatlens-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: threatlens_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "27018:27017"
    volumes:
      - threatlens_mongodb_data:/data/db

volumes:
  threatlens_mongodb_data:
